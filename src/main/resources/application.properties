server.port=8080

spring.application.name=mell-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/mell_apoyo_db
spring.datasource.username=postgres
spring.datasource.password=ELIcuci
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ---------------------------------------------------------------------------
# Credenciales y endpoints de APIs externas.
# NUNCA hardcodear valores reales aqui: siempre vienen de variables de entorno
# (.env local, o Secrets Manager / variables de entorno del contenedor en prod).
# ---------------------------------------------------------------------------
mell.openai.api-key=${OPENAI_API_KEY:}
mell.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
mell.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o}
mell.openai.whisper-model=${OPENAI_WHISPER_MODEL:whisper-1}

mell.elevenlabs.api-key=${ELEVENLABS_API_KEY:}
mell.elevenlabs.base-url=${ELEVENLABS_BASE_URL:https://api.elevenlabs.io/v1}
mell.elevenlabs.default-voice-id=${ELEVENLABS_DEFAULT_VOICE_ID:}

mell.aws.region=${AWS_REGION:us-east-1}
mell.aws.s3-bucket=${AWS_S3_BUCKET:mell-audio-dev}
mell.aws.access-key=${AWS_ACCESS_KEY_ID:}
mell.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}

mell.guardrails.crisis-hotline-message=${CRISIS_HOTLINE_MESSAGE:Si estas en una situacion de crisis, por favor contacta a una linea de ayuda: 113 (Peru) o la linea local de tu pais.}

logging.level.com.mell.backend=DEBUG
logging.level.org.springframework.web.reactive.function.client=INFO

# --- Seguridad JWT ---
mell.security.jwt-secret=${JWT_SECRET:}
mell.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# --- Google Sign-In ---
mell.google.client-id=${GOOGLE_CLIENT_ID:}